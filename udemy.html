<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #ffd6e7;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

/* ===== SCROLLING COLLAGE ===== */
.collage {
  width: 22%;
  height: 100vh;
  overflow: hidden;
  position: relative;
}

.scroll {
  display: grid;
  gap: 10px;
  animation: scroll 18s linear infinite;
}

.collage img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 18px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.25);
}

@keyframes scroll {
  0% { transform: translateY(0); }
  100% { transform: translateY(-50%); }
}

/* ===== CENTER SLIDESHOW ===== */
.center-bg {
  position: absolute;
  width: 50%;
  height: 80%;
  left: 25%;
  top: 10%;
  border-radius: 25px;
  background-size: cover;
  background-position: center;
  opacity: 0.45; /* ← transparency */
  z-index: 1;
  animation: slideshow 20s infinite;
}

@keyframes slideshow {
  0% { background-image: url("p1.jpeg"); }
  20% { background-image: url("p2.jpeg"); }
  40% { background-image: url("p3.jpeg"); }
  60% { background-image: url("p4.jpeg"); }
  80% { background-image: url("p5.jpeg"); }
  100% { background-image: url("p1.jpeg"); }
}

/* ===== GLASS CARD ===== */
.container {
  position: relative;
  z-index: 5;
  width: 40%;
  padding: 30px;
  border-radius: 25px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(6px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  text-align: center;
}

h1 {
  color: #d81b60;
  font-size: 2rem;
}

button {
  padding: 12px 25px;
  font-size: 1rem;
  margin: 10px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
}

#yesButton { background: #ff4081; color: white; }
#noButton { background: #ef5350; color: white; }
#musicBtn { background: #7b1fa2; color: white; }

#message {
  margin-top: 15px;
  font-size: 1.1rem;
  color: #d81b60;
  display: none;
}

/* ===== HEART RAIN ===== */
.heart {
  position: fixed;
  top: -20px;
  font-size: 22px;
  animation: fall 4s linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to { transform: translateY(110vh); opacity: 0; }
}

/* ===== SPARKLE CURSOR ===== */
.sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  pointer-events: none;
  animation: sparkle 0.8s linear forwards;
}

@keyframes sparkle {
  0% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(3); }
}
</style>
</head>

<body>

<audio id="bgMusic">
  <source src="song.mp3.mp3" type="audio/mpeg">
</audio>

<!-- LEFT COLLAGE -->
<div class="collage">
  <div class="scroll">
    <img src="p1.jpeg"><img src="p2.jpeg"><img src="p3.jpeg">
    <img src="p4.jpeg"><img src="p5.jpeg">
    <img src="p1.jpeg"><img src="p2.jpeg"><img src="p3.jpeg">
    <img src="p4.jpeg"><img src="p5.jpeg">
  </div>
</div>

<!-- CENTER BG -->
<div class="center-bg"></div>

<!-- MAIN CARD -->
<div class="container">
  <h1>Will You Be My Valentine? 💘</h1>

  <button id="musicBtn">🎵 Play Music</button><br>
  <button id="yesButton">Yes 💖</button>
  <button id="noButton">No 😢</button>

  <div id="message">
    I knew you'd say yes! 💞<br>
    Meet me today at <strong>7:00 PM</strong> 💌
  </div>
</div>

<!-- RIGHT COLLAGE -->
<div class="collage">
  <div class="scroll">
    <img src="p6.jpeg"><img src="p7.jpeg"><img src="p8.jpeg">
    <img src="p9.jpeg"><img src="p10.jpeg">
    <img src="p6.jpeg"><img src="p7.jpeg"><img src="p8.jpeg">
    <img src="p9.jpeg"><img src="p10.jpeg">
  </div>
</div>

<script>
const music = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
const noButton = document.getElementById('noButton');
const yesButton = document.getElementById('yesButton');
const message = document.getElementById('message');

musicBtn.onclick = () => {
  music.play();
  musicBtn.innerText = "🎶 Playing";
};

noButton.addEventListener('mouseover', () => {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 200 - 100;
  noButton.style.transform = `translate(${x}px, ${y}px)`;
});

yesButton.onclick = () => {
  message.style.display = 'block';

  for (let i = 0; i < 40; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerText = '💖';
    heart.style.left = Math.random() * 100 + 'vw';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
  }
};

document.addEventListener('mousemove', e => {
  const sparkle = document.createElement('div');
  sparkle.className = 'sparkle';
  sparkle.style.left = e.clientX + 'px';
  sparkle.style.top = e.clientY + 'px';
  document.body.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), 800);
});
</script>

</body>
</html>
